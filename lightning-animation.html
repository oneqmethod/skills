<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightning Thoughts</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d0d0d;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

.scene {
  position: relative;
  width: 520px;
  height: 520px;
}

/* ── Orbit rings ── */
.ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.07);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  transition: border-color 0.1s;
}
.ring-1 { width: 140px; height: 140px; }
.ring-2 { width: 240px; height: 240px; }
.ring-3 { width: 340px; height: 340px; }
.ring-4 { width: 460px; height: 460px; }

@keyframes ringPulse {
  0%   { border-color: rgba(255,255,255,0.07); box-shadow: none; }
  25%  { border-color: rgba(255,255,255,0.55); box-shadow: 0 0 8px rgba(255,255,255,0.15); }
  100% { border-color: rgba(255,255,255,0.07); box-shadow: none; }
}
.ring.pulse { animation: ringPulse 0.9s ease-out forwards; }

/* ── Center icon ── */
.center-icon {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 82px; height: 82px;
  background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
  border-radius: 22px;
  border: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  z-index: 10;
  transition: box-shadow 0.4s;
}

.lightning-path {
  fill: #5a5a5a;
  transition: fill 0.4s;
  filter: drop-shadow(0 0 0px transparent);
}

/* Charged state */
.center-icon.charged {
  box-shadow:
    0 0 0 2px rgba(255,215,0,0.3),
    0 0 30px rgba(255,200,0,0.5),
    0 0 70px rgba(255,180,0,0.25),
    0 4px 24px rgba(0,0,0,0.6);
}
.center-icon.charged .lightning-path {
  fill: #FFD700;
  filter: drop-shadow(0 0 6px rgba(255,215,0,0.9)) drop-shadow(0 0 16px rgba(255,180,0,0.6));
}

/* Buzz animation */
@keyframes buzz {
  0%   { transform: translate(-50%,-50%) translate(0,0)    rotate(0deg)   scale(1);    }
  10%  { transform: translate(-50%,-50%) translate(-2px,1px) rotate(-1.5deg) scale(1.04); }
  20%  { transform: translate(-50%,-50%) translate(2px,-1px) rotate(1.5deg)  scale(0.97); }
  30%  { transform: translate(-50%,-50%) translate(-1px,2px) rotate(-1deg)   scale(1.05); }
  40%  { transform: translate(-50%,-50%) translate(1px,-2px) rotate(1deg)    scale(0.98); }
  50%  { transform: translate(-50%,-50%) translate(-2px,0px) rotate(-2deg)   scale(1.04); }
  60%  { transform: translate(-50%,-50%) translate(2px,1px)  rotate(2deg)    scale(0.97); }
  70%  { transform: translate(-50%,-50%) translate(-1px,-1px) rotate(-1deg)  scale(1.03); }
  80%  { transform: translate(-50%,-50%) translate(1px,1px)  rotate(1deg)    scale(0.99); }
  90%  { transform: translate(-50%,-50%) translate(0,-1px)   rotate(0.5deg)  scale(1.01); }
  100% { transform: translate(-50%,-50%) translate(0,0)      rotate(0deg)   scale(1);    }
}
.center-icon.buzzing {
  animation: buzz 0.12s linear infinite;
}

/* ── Avatars ── */
.avatar-wrapper {
  position: absolute;
  top: 0; left: 0;
  width: 66px; height: 66px;
  pointer-events: none;
  z-index: 10;
}
.avatar-circle {
  width: 66px; height: 66px;
  border-radius: 50%;
  background: #1e1e1e;
  border: 2px solid #2e2e2e;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.4s, box-shadow 0.4s;
}
.avatar-circle.sent {
  border-color: #666;
  box-shadow: 0 0 12px rgba(180,180,180,0.25);
}

/* ── Canvas ── */
#particleCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 520px; height: 520px;
  pointer-events: none;
  z-index: 5;
}
</style>
</head>

// ── DOM setup ──────────────────────────────────────────
const scene      = document.getElementById('scene');
const canvas     = document.getElementById('particleCanvas');
const ctx        = canvas.getContext('2d');
const centerIcon = document.getElementById('centerIcon');
const rings      = ['ring1','ring2','ring3','ring4'].map(id => document.getElementById(id));

const W = 520, H = 520;
const CX = W/2, CY = H/2;

const avatarAngles    = Array.from({length:5}, (_,i) => -90 + i*72);
const avatarPositions = avatarAngles.map(deg => {
  const r = deg * Math.PI / 180;
  return { x: CX + ORBIT_R * Math.cos(r), y: CY + ORBIT_R * Math.sin(r) };
});

const avatarEls = AVATARS.map((svg, i) => {
  const { x, y } = avatarPositions[i];
  const wrap = document.createElement('div');
  wrap.className = 'avatar-wrapper';
  wrap.style.transform = `translate(${x-33}px, ${y-33}px)`;
  wrap.innerHTML = `<div class="avatar-circle" id="av${i}">${svg}</div>`;
  scene.appendChild(wrap);
  return wrap.querySelector('.avatar-circle');
});

// ── Bezier helpers ──────────────────────────────────────
function bezierPt(path, t) {
  const { s, cp, e } = path;
  const mt = 1-t;
  return { x: mt*mt*s.x + 2*mt*t*cp.x + t*t*e.x,
           y: mt*mt*s.y + 2*mt*t*cp.y + t*t*e.y };
}
function bezierPerp(path, t) {
  const { s, cp, e } = path;
  const mt = 1-t;
  const tx = 2*(mt*(cp.x-s.x) + t*(e.x-cp.x));
  const ty = 2*(mt*(cp.y-s.y) + t*(e.y-cp.y));
  const l  = Math.hypot(tx, ty);
  return { x: -ty/l, y: tx/l };   // unit perpendicular
}

// ── Nerve paths: bezier + pre-baked strand & branch data ─
const CURVE_OFFSETS = [-38, 30, -20, 34, -28];
const STRAND_SEP    = 2.8;   // px between parallel fibers
const WAVE_AMP      = 2.2;   // sinusoidal undulation amplitude
const WAVE_FREQ     = 7;     // oscillation cycles along full path
const NODE_TS       = [0.18, 0.36, 0.55, 0.73, 0.90]; // Nodes of Ranvier

const nervePaths = avatarPositions.map((pos, i) => {
  const dx = CX-pos.x, dy = CY-pos.y;
  const len = Math.hypot(dx, dy);
  const px = -dy/len, py = dx/len;
  const cp = {
    x: pos.x + dx*0.5 + px*CURVE_OFFSETS[i],
    y: pos.y + dy*0.5 + py*CURVE_OFFSETS[i]
  };
  const path = { s: pos, cp, e: { x: CX, y: CY } };

  // Branch nerve: splits off at t≈0.45, grows ≈22px at an angle
  const bt   = 0.44;
  const mt   = 1-bt;
  const bx   = mt*mt*pos.x + 2*mt*bt*cp.x + bt*bt*CX;
  const by   = mt*mt*pos.y + 2*mt*bt*cp.y + bt*bt*CY;
  const perp = bezierPerp(path, bt);
  const tang = (() => { // unit tangent at bt
    const tx = 2*(mt*(cp.x-pos.x)+bt*(CX-cp.x));
    const ty = 2*(mt*(cp.y-pos.y)+bt*(CY-cp.y));
    const l  = Math.hypot(tx,ty);
    return { x: tx/l, y: ty/l };
  })();
  const side   = i % 2 === 0 ? 1 : -1;
  const brLen  = 22;
  const br2Len = 12;
  const brEnd  = { x: bx+(tang.x*0.5+perp.x*side*0.87)*brLen,
                   y: by+(tang.y*0.5+perp.y*side*0.87)*brLen };
  const br2End = { x: brEnd.x+(tang.x*0.4+perp.x*side*0.92)*br2Len,
                   y: brEnd.y+(tang.y*0.4+perp.y*side*0.92)*br2Len };

  return { ...path, branch: { at:{x:bx,y:by}, end:brEnd, tip:br2End, side } };
});

// ── Draw one nerve fiber strand (wavy line) ─────────────
function drawStrand(path, offsetPx, phaseDeg, alpha, lineW) {
  const N = 80;
  ctx.beginPath();
  for (let s = 0; s <= N; s++) {
    const t    = s/N;
    const pt   = bezierPt(path, t);
    const perp = bezierPerp(path, t);
    const wave = Math.sin(t * Math.PI * WAVE_FREQ + phaseDeg) * WAVE_AMP;
    const off  = offsetPx + wave;
    s === 0
      ? ctx.moveTo(pt.x + perp.x*off, pt.y + perp.y*off)
      : ctx.lineTo(pt.x + perp.x*off, pt.y + perp.y*off);
  }
  ctx.strokeStyle = `rgba(190,190,190,${alpha})`;
  ctx.lineWidth   = lineW;
  ctx.lineCap     = 'round';
  ctx.setLineDash([]);
  ctx.stroke();
}

// ── Draw full nerve (3 strands + nodes + branch) ────────
function drawNerve(path, act) {
  const base = 0.06 + act * 0.22;

  // Myelin sheath glow (wide soft layer behind strands)
  if (act > 0.03) {
    ctx.beginPath();
    ctx.moveTo(path.s.x, path.s.y);
    ctx.quadraticCurveTo(path.cp.x, path.cp.y, path.e.x, path.e.y);
    ctx.strokeStyle = `rgba(200,200,200,${act * 0.10})`;
    ctx.lineWidth   = 14;
    ctx.stroke();
  }

  // 3 parallel nerve fibers with staggered wave phase
  const strands = [
    { off: -STRAND_SEP, phase: 0 },
    { off:  0,          phase: Math.PI * 0.66 },
    { off:  STRAND_SEP, phase: Math.PI * 1.33 },
  ];
  strands.forEach(({ off, phase }) => {
    drawStrand(path, off, phase, base * 0.75, 0.75);
  });

  // Nodes of Ranvier — small rings where myelin is absent
  NODE_TS.forEach(t => {
    const pt = bezierPt(path, t);
    // Ring
    ctx.strokeStyle = `rgba(210,210,210,${base * 1.4})`;
    ctx.lineWidth   = 1.2;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.8, 0, Math.PI*2); ctx.stroke();
    // Centre dot
    ctx.fillStyle = `rgba(240,240,240,${base * 0.9})`;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 1.1, 0, Math.PI*2); ctx.fill();
  });

  // Branch nerve (1 thinner fiber)
  const br = path.branch;
  drawStrand({ s: br.at, cp: {
    x: (br.at.x+br.end.x)*0.5,
    y: (br.at.y+br.end.y)*0.5
  }, e: br.end }, 0, Math.PI*0.5, base*0.55, 0.55);
  // Tiny secondary branch tip
  drawStrand({ s: br.end, cp: {
    x: (br.end.x+br.tip.x)*0.5,
    y: (br.end.y+br.tip.y)*0.5
  }, e: br.tip }, 0, Math.PI*1.1, base*0.38, 0.4);

  // Terminal node at avatar end
  const head = bezierPt(path, 0);
  ctx.fillStyle   = `rgba(200,200,200,${base * 1.1})`;
  ctx.beginPath(); ctx.arc(head.x, head.y, 2.5, 0, Math.PI*2); ctx.fill();
}

// ── Action Potential pulse ──────────────────────────────
class NervePulse {
  constructor(pathIdx, tOffset) {
    this.path   = nervePaths[pathIdx];
    this.t      = -tOffset;
    this.isLead = tOffset === 0;
    this.done   = false;
  }
  update() {
    this.t += P_SPEED;
    if (this.t >= 1) { this.t = 1; this.done = true; }
  }
  draw() {
    if (this.t <= 0) return;
    const tc = Math.min(1, this.t);

    // Depolarisation front — covers all 3 strands width
    const steps = 26, dt = 0.033;
    for (let s = 1; s < steps; s++) {
      const tA = Math.max(0, tc - s*dt);
      const tB = Math.max(0, tc - (s-1)*dt);
      if (tA === tB) break;
      const pA = bezierPt(this.path, tA);
      const pB = bezierPt(this.path, tB);
      const a  = (1 - s/steps) * 0.65 * (1 - tc*0.15);
      ctx.strokeStyle = `rgba(230,230,230,${a})`;
      ctx.lineWidth   = 8 + (1-tA)*2; // slightly wider near avatar
      ctx.lineCap     = 'round';
      ctx.beginPath(); ctx.moveTo(pB.x, pB.y); ctx.lineTo(pA.x, pA.y); ctx.stroke();
    }

    // Flash at each Node of Ranvier as pulse passes
    NODE_TS.forEach(nt => {
      const dist = Math.abs(tc - nt);
      if (dist < 0.06) {
        const flash = (1 - dist/0.06) * 0.8;
        const np = bezierPt(this.path, nt);
        const fg = ctx.createRadialGradient(np.x, np.y, 0, np.x, np.y, 8);
        fg.addColorStop(0, `rgba(255,255,255,${flash})`);
        fg.addColorStop(1, `rgba(255,255,255,0)`);
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(np.x, np.y, 8, 0, Math.PI*2); ctx.fill();
      }
    });

    // Leading edge glow
    const head  = bezierPt(this.path, tc);
    const alpha = 0.92 - tc*0.12;
    const g = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 13);
    g.addColorStop(0,   `rgba(255,255,255,${alpha*0.85})`);
    g.addColorStop(0.35,`rgba(255,255,255,${alpha*0.35})`);
    g.addColorStop(1,   `rgba(255,255,255,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(head.x, head.y, 13, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath(); ctx.arc(head.x, head.y, 2.8, 0, Math.PI*2); ctx.fill();
  }
}

// ── State ──────────────────────────────────────────────
let pulses        = [];
let arrivedCount  = 0;
let cyclePhase    = 'idle';
let thoughtTimers = [];
let pathActivity  = new Array(5).fill(0);

// ── Helpers ────────────────────────────────────────────
function pulseRings() {
  rings.forEach((ring, i) => {
    setTimeout(() => {
      ring.classList.remove('pulse'); void ring.offsetWidth; ring.classList.add('pulse');
    }, i * 55);
  });
}

function sendThought(idx) {
  avatarEls[idx].classList.add('sent');
  pathActivity[idx] = 1.0;
  [0, PULSE_GAP, PULSE_GAP*2].forEach(off => pulses.push(new NervePulse(idx, off)));
  pulseRings();
}

function chargeLightning() {
  cyclePhase = 'charging';
  centerIcon.classList.add('charged', 'buzzing');
  setTimeout(() => {
    centerIcon.classList.remove('buzzing');
    setTimeout(resetCycle, RESET_PAUSE);
  }, BUZZ_DURATION);
}

function resetCycle() {
  cyclePhase    = 'resetting';
  arrivedCount  = 0;
  pulses        = [];
  pathActivity  = new Array(5).fill(0);
  thoughtTimers.forEach(t => clearTimeout(t));
  thoughtTimers = [];
  centerIcon.classList.remove('charged', 'buzzing');
  avatarEls.forEach(el => el.classList.remove('sent'));
  setTimeout(startCycle, 600);
}

function startCycle() {
  cyclePhase = 'running';
  [0,1,2,3,4].forEach(idx => {
    const delay = Math.random() * 3500;
    thoughtTimers.push(setTimeout(() => sendThought(idx), delay));
  });
}

// ── Animation loop ─────────────────────────────────────
function animate() {
  ctx.clearRect(0, 0, W, H);

  nervePaths.forEach((path, i) => {
    drawNerve(path, pathActivity[i]);
    if (pathActivity[i] > 0.01) pathActivity[i] *= 0.97;
  });

  pulses = pulses.filter(p => {
    p.update(); p.draw();
    if (p.done) {
      if (p.isLead) {
        arrivedCount++;
        if (arrivedCount >= 5 && cyclePhase === 'running') chargeLightning();
      }
      return false;
    }
    return true;
  });

  requestAnimationFrame(animate);
}

// ── Boot ───────────────────────────────────────────────
animate();
setTimeout(startCycle, 800);
</script>
