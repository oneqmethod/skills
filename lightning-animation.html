<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightning Thoughts</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d0d0d;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

.scene {
  position: relative;
  width: 520px;
  height: 520px;
}

/* ── Orbit rings ── */
.ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.07);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  transition: border-color 0.1s;
}
.ring-1 { width: 140px; height: 140px; }
.ring-2 { width: 240px; height: 240px; }
.ring-3 { width: 340px; height: 340px; }
.ring-4 { width: 460px; height: 460px; }

@keyframes ringPulse {
  0%   { border-color: rgba(255,255,255,0.07); box-shadow: none; }
  25%  { border-color: rgba(255,255,255,0.55); box-shadow: 0 0 8px rgba(255,255,255,0.15); }
  100% { border-color: rgba(255,255,255,0.07); box-shadow: none; }
}
.ring.pulse { animation: ringPulse 0.9s ease-out forwards; }

/* ── Center icon ── */
.center-icon {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 82px; height: 82px;
  background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
  border-radius: 22px;
  border: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  z-index: 10;
  transition: box-shadow 0.4s;
}

.lightning-path {
  fill: #5a5a5a;
  transition: fill 0.4s;
  filter: drop-shadow(0 0 0px transparent);
}

/* Charged state */
.center-icon.charged {
  box-shadow:
    0 0 0 2px rgba(255,215,0,0.3),
    0 0 30px rgba(255,200,0,0.5),
    0 0 70px rgba(255,180,0,0.25),
    0 4px 24px rgba(0,0,0,0.6);
}
.center-icon.charged .lightning-path {
  fill: #FFD700;
  filter: drop-shadow(0 0 6px rgba(255,215,0,0.9)) drop-shadow(0 0 16px rgba(255,180,0,0.6));
}

/* Buzz animation */
@keyframes buzz {
  0%   { transform: translate(-50%,-50%) translate(0,0)    rotate(0deg)   scale(1);    }
  10%  { transform: translate(-50%,-50%) translate(-2px,1px) rotate(-1.5deg) scale(1.04); }
  20%  { transform: translate(-50%,-50%) translate(2px,-1px) rotate(1.5deg)  scale(0.97); }
  30%  { transform: translate(-50%,-50%) translate(-1px,2px) rotate(-1deg)   scale(1.05); }
  40%  { transform: translate(-50%,-50%) translate(1px,-2px) rotate(1deg)    scale(0.98); }
  50%  { transform: translate(-50%,-50%) translate(-2px,0px) rotate(-2deg)   scale(1.04); }
  60%  { transform: translate(-50%,-50%) translate(2px,1px)  rotate(2deg)    scale(0.97); }
  70%  { transform: translate(-50%,-50%) translate(-1px,-1px) rotate(-1deg)  scale(1.03); }
  80%  { transform: translate(-50%,-50%) translate(1px,1px)  rotate(1deg)    scale(0.99); }
  90%  { transform: translate(-50%,-50%) translate(0,-1px)   rotate(0.5deg)  scale(1.01); }
  100% { transform: translate(-50%,-50%) translate(0,0)      rotate(0deg)   scale(1);    }
}
.center-icon.buzzing {
  animation: buzz 0.12s linear infinite;
}

/* ── Avatars ── */
.avatar-wrapper {
  position: absolute;
  top: 0; left: 0;
  width: 66px; height: 66px;
  pointer-events: none;
  z-index: 10;
}
.avatar-circle {
  width: 66px; height: 66px;
  border-radius: 50%;
  background: #1e1e1e;
  border: 2px solid #2e2e2e;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.4s, box-shadow 0.4s;
}
.avatar-circle.sent {
  border-color: #666;
  box-shadow: 0 0 12px rgba(180,180,180,0.25);
}

/* ── Canvas ── */
#particleCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 520px; height: 520px;
  pointer-events: none;
  z-index: 5;
}
</style>
</head>
<body>
<div class="scene" id="scene">

  <!-- Orbit rings -->
  <div class="ring ring-4" id="ring4"></div>
  <div class="ring ring-3" id="ring3"></div>
  <div class="ring ring-2" id="ring2"></div>
  <div class="ring ring-1" id="ring1"></div>

  <!-- Particle canvas -->
  <canvas id="particleCanvas" width="520" height="520"></canvas>

  <!-- Center icon -->
  <div class="center-icon" id="centerIcon">
    <svg width="38" height="38" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path class="lightning-path" d="M13 2L3 14h8l-1 8 10-12h-8z"/>
    </svg>
  </div>

</div>

<script>
// ── Config ──────────────────────────────────────────────
const ORBIT_R       = 185;   // px from center to avatar center
const INTERVAL      = 2500;  // ms between each avatar's thought
const P_SPEED       = 3.2;   // particle px/frame (~60fps ≈ 1.1s travel)
const BUZZ_DURATION = 2200;  // ms lightning stays charged + buzzing
const RESET_PAUSE   = 1200;  // ms golden pause before reset

// ── Avatar SVGs ─────────────────────────────────────────
const AVATARS = [
  // 1 – Glasses + beard
  `<svg viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
    <circle cx="33" cy="66" r="22" fill="#2b2b2b"/>
    <rect x="27" y="52" width="12" height="10" rx="5" fill="#555"/>
    <circle cx="33" cy="31" r="19" fill="#555"/>
    <path d="M14 31 Q33 50 52 31 Q49 48 33 51 Q17 48 14 31Z" fill="#444"/>
    <rect x="16" y="26" width="13" height="9" rx="3.5" fill="none" stroke="#888" stroke-width="1.8"/>
    <rect x="37" y="26" width="13" height="9" rx="3.5" fill="none" stroke="#888" stroke-width="1.8"/>
    <line x1="29" y1="30.5" x2="37" y2="30.5" stroke="#888" stroke-width="1.8"/>
    <circle cx="22.5" cy="30.5" r="2" fill="#222"/>
    <circle cx="43.5" cy="30.5" r="2" fill="#222"/>
  </svg>`,

  // 2 – Wide brim hat
  `<svg viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
    <circle cx="33" cy="66" r="22" fill="#2b2b2b"/>
    <rect x="27" y="52" width="12" height="10" rx="5" fill="#666"/>
    <circle cx="33" cy="35" r="18" fill="#666"/>
    <ellipse cx="33" cy="21" rx="26" ry="5.5" fill="#3a3a3a"/>
    <rect x="20" y="9" width="26" height="14" rx="5" fill="#3a3a3a"/>
    <circle cx="27" cy="35" r="2.5" fill="#222"/>
    <circle cx="39" cy="35" r="2.5" fill="#222"/>
    <path d="M27 42 Q33 47 39 42" stroke="#444" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </svg>`,

  // 3 – Astronaut helmet
  `<svg viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="33" cy="63" rx="22" ry="8" fill="#3a3a3a"/>
    <circle cx="33" cy="34" r="22" fill="#4a4a4a"/>
    <ellipse cx="33" cy="34" rx="16" ry="14" fill="#2a2a2a"/>
    <ellipse cx="33" cy="32" rx="13" ry="10" fill="#333"/>
    <circle cx="27" cy="32" r="2.2" fill="#aaa" opacity="0.7"/>
    <circle cx="39" cy="32" r="2.2" fill="#aaa" opacity="0.7"/>
    <ellipse cx="27" cy="32" rx="2.8" ry="2.2" fill="none" stroke="#555" stroke-width="1"/>
    <ellipse cx="39" cy="32" rx="2.8" ry="2.2" fill="none" stroke="#555" stroke-width="1"/>
    <circle cx="16" cy="25" r="3.5" fill="#383838" stroke="#555" stroke-width="1"/>
    <circle cx="50" cy="25" r="3.5" fill="#383838" stroke="#555" stroke-width="1"/>
    <rect x="29" y="54" width="8" height="5" rx="2" fill="#3a3a3a"/>
  </svg>`,

  // 4 – Curly / afro
  `<svg viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
    <circle cx="33" cy="66" r="22" fill="#2b2b2b"/>
    <rect x="27" y="52" width="12" height="10" rx="5" fill="#666"/>
    <circle cx="33" cy="37" r="17" fill="#666"/>
    <circle cx="33" cy="20" r="15" fill="#3a3a3a"/>
    <circle cx="19" cy="27" r="9"  fill="#3a3a3a"/>
    <circle cx="47" cy="27" r="9"  fill="#3a3a3a"/>
    <circle cx="33" cy="12" r="7"  fill="#3a3a3a"/>
    <circle cx="27" cy="37" r="2.5" fill="#222"/>
    <circle cx="39" cy="37" r="2.5" fill="#222"/>
    <path d="M27 44 Q33 49 39 44" stroke="#444" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </svg>`,

  // 5 – Side-part hair / feminine
  `<svg viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
    <circle cx="33" cy="66" r="22" fill="#2b2b2b"/>
    <rect x="27" y="52" width="12" height="10" rx="5" fill="#777"/>
    <circle cx="33" cy="34" r="18" fill="#777"/>
    <path d="M15 28 Q14 10 33 10 Q52 10 51 28 Q51 14 45 12 Q33 8 20 14 Z" fill="#3a3a3a"/>
    <path d="M15 28 Q13 22 16 16" stroke="#3a3a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="27" cy="33" r="2.5" fill="#222"/>
    <circle cx="39" cy="33" r="2.5" fill="#222"/>
    <path d="M27 41 Q33 46 39 41" stroke="#555" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="16" cy="35" r="2" fill="#666"/>
  </svg>`
];

// ── DOM setup ──────────────────────────────────────────
const scene      = document.getElementById('scene');
const canvas     = document.getElementById('particleCanvas');
const ctx        = canvas.getContext('2d');
const centerIcon = document.getElementById('centerIcon');
const rings      = ['ring1','ring2','ring3','ring4'].map(id => document.getElementById(id));

const W = 520, H = 520;
const CX = W / 2, CY = H / 2;

// Place 5 avatars evenly, starting from top (-90°)
const avatarAngles   = Array.from({length:5}, (_,i) => -90 + i * 72);
const avatarPositions = avatarAngles.map(deg => {
  const r = deg * Math.PI / 180;
  return { x: CX + ORBIT_R * Math.cos(r), y: CY + ORBIT_R * Math.sin(r) };
});

const avatarEls = AVATARS.map((svg, i) => {
  const { x, y } = avatarPositions[i];
  const wrap = document.createElement('div');
  wrap.className = 'avatar-wrapper';
  wrap.style.transform = `translate(${x - 33}px, ${y - 33}px)`;
  wrap.innerHTML = `<div class="avatar-circle" id="av${i}">${svg}</div>`;
  scene.appendChild(wrap);
  return wrap.querySelector('.avatar-circle');
});

// ── Particle class ─────────────────────────────────────
class Particle {
  constructor(sx, sy) {
    this.sx = sx; this.sy = sy;
    this.x  = sx; this.y  = sy;
    this.ex = CX; this.ey = CY;
    const dx = this.ex - sx, dy = this.ey - sy;
    this.dist  = Math.hypot(dx, dy);
    this.angle = Math.atan2(dy, dx);
    this.prog  = 0;
    this.done  = false;
  }
  update() {
    this.prog += P_SPEED;
    if (this.prog >= this.dist) { this.x = this.ex; this.y = this.ey; this.done = true; return; }
    const t = this.prog / this.dist;
    this.x = this.sx + (this.ex - this.sx) * t;
    this.y = this.sy + (this.ey - this.sy) * t;
  }
  draw() {
    const t = Math.min(1, this.prog / this.dist);
    const alpha = 1 - t * 0.5;

    // Trail
    const trailLen = 28;
    const tx = this.x - Math.cos(this.angle) * trailLen;
    const ty = this.y - Math.sin(this.angle) * trailLen;
    const grad = ctx.createLinearGradient(this.x, this.y, tx, ty);
    grad.addColorStop(0, `rgba(230,230,230,${alpha * 0.7})`);
    grad.addColorStop(1, `rgba(230,230,230,0)`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    // Glow halo
    const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 10);
    glow.addColorStop(0, `rgba(255,255,255,${alpha * 0.5})`);
    glow.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
    ctx.fill();

    // Core dot
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── State ──────────────────────────────────────────────
let particles = [];
let arrivedCount = 0;
let cyclePhase = 'idle'; // 'running' | 'charging' | 'resetting'
let thoughtIndex = 0;
let thoughtTimer = null;

// ── Helpers ────────────────────────────────────────────
function pulseRings() {
  rings.forEach((ring, i) => {
    // stagger slightly inward (outermost first feels nice)
    const delay = i * 55;
    setTimeout(() => {
      ring.classList.remove('pulse');
      void ring.offsetWidth;
      ring.classList.add('pulse');
    }, delay);
  });
}

function sendThought(idx) {
  const { x, y } = avatarPositions[idx];
  avatarEls[idx].classList.add('sent');
  particles.push(new Particle(x, y));
  pulseRings();
}

function chargeLightning() {
  cyclePhase = 'charging';
  centerIcon.classList.add('charged', 'buzzing');

  setTimeout(() => {
    centerIcon.classList.remove('buzzing');        // stop shaking, stay gold
    setTimeout(resetCycle, RESET_PAUSE);
  }, BUZZ_DURATION);
}

function resetCycle() {
  cyclePhase = 'resetting';
  arrivedCount = 0;
  thoughtIndex = 0;
  particles = [];
  clearTimeout(thoughtTimer);

  centerIcon.classList.remove('charged', 'buzzing');
  avatarEls.forEach(el => el.classList.remove('sent'));

  setTimeout(startCycle, 600);
}

function scheduleThought() {
  if (thoughtIndex >= 5) return;
  thoughtTimer = setTimeout(() => {
    sendThought(thoughtIndex);
    thoughtIndex++;
    scheduleThought();
  }, INTERVAL);
}

function startCycle() {
  cyclePhase = 'running';
  scheduleThought();
}

// ── Draw static orbit guide lines ─────────────────────
function drawGuideLines() {
  avatarPositions.forEach(({ x, y }) => {
    const grad = ctx.createLinearGradient(x, y, CX, CY);
    grad.addColorStop(0,   'rgba(255,255,255,0.04)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.06)');
    grad.addColorStop(1,   'rgba(255,255,255,0.01)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(CX, CY);
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

// ── Animation loop ─────────────────────────────────────
function animate() {
  ctx.clearRect(0, 0, W, H);
  drawGuideLines();

  particles = particles.filter(p => {
    p.update();
    p.draw();
    if (p.done) {
      arrivedCount++;
      if (arrivedCount >= 5 && cyclePhase === 'running') {
        chargeLightning();
      }
      return false;
    }
    return true;
  });

  requestAnimationFrame(animate);
}

// ── Boot ───────────────────────────────────────────────
animate();
setTimeout(startCycle, 800);
</script>
</body>
</html>
